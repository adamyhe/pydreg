<title>dreg versus pydreg 0.2.6/0.2.7 walltime and peak memory</title>
<desc>Two log-scale scatterplots comparing dreg against two pydreg releases (0.2.6 and 0.2.7). Every completed experiment is below the equality diagonal, showing lower walltime and peak memory for both pydreg releases versus dreg.</desc>
