name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 excluded: scipy>=1.16 (needed for scipy.stats._qmvnt._qmvn_inner,
        # see pyproject.toml) itself requires Python >=3.11.
        # 3.14 excluded: two native-extension deps aren't ready yet, confirmed
        # 2026-08-15. pybigtools: no cp314 wheel on PyPI, and the released
        # 0.3.0's pinned PyO3 (0.22) predates 3.14 support entirely, so
        # building from source fails too -- master has bumped to PyO3 0.28
        # and added a 3.14 wheel-build CI step, but no release has been cut
        # since (still unreleased as `0.3.1-dev`). safetensors: same
        # situation independently -- upstream CI already tests 3.14/3.14t,
        # but 0.8.0 (and its RCs) ship no cp314 wheels. Every other
        # dependency (including numba/llvmlite, historically the slowest to
        # catch up) already has cp314 wheels. Revisit once pybigtools and
        # safetensors both ship a release with cp314 wheels.
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest tests/ -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
