<svg xmlns="http://www.w3.org/2000/svg" width="960" height="322" viewBox="0 0 960 322" role="img">
<title>Positions processed per GPU operation: dREG vs pydreg, per library, log scale</title>
<style>
text { font-family: DejaVu Sans, Helvetica, Arial, sans-serif; fill: #202124; }
.title { font-size: 26px; font-weight: 600; }
.subtitle { font-size: 17px; fill: #5f6368; }
.colhead { font-size: 19px; font-weight: 600; }
.rowlabel { font-size: 16px; font-weight: 600; }
.panelstat { font-size: 14px; fill: #5f6368; }
.tick { font-size: 14px; fill: #5f6368; }
.axis { font-size: 16px; fill: #5f6368; }
.value { font-size: 14px; font-weight: 600; }
.gap { font-size: 14px; fill: #202124; }
.legend { font-size: 16px; }
.grid { stroke: #e3e6e8; stroke-width: 1; }
.plotbg { fill: #fbfbfa; stroke: #e3e6e8; }
.connector { stroke: #c7c6bd; stroke-width: 2; }
</style>
<rect width="960" height="322" fill="#fff"/>
<text x="196" y="34" class="title">Work done per GPU operation</text>
<text x="196" y="58" class="subtitle">1 library, log scale, higher = more efficient -- median gap 25x per kernel launch, 972x per memcpy call</text>
<circle cx="196" cy="86" r="7" fill="#eb6834"/>
<text x="210" y="91" class="legend">dREG</text>
<circle cx="300" cy="86" r="7" fill="#2a78d6"/>
<text x="314" y="91" class="legend">pydreg</text>
<text x="196" y="124" class="colhead">Positions per kernel launch</text>
<line x1="196.0" y1="136" x2="196.0" y2="162" class="grid"/>
<text x="196.0" y="184" class="tick" text-anchor="middle">1</text>
<line x1="356.5" y1="136" x2="356.5" y2="162" class="grid"/>
<text x="356.5" y="184" class="tick" text-anchor="middle">10</text>
<line x1="517.0" y1="136" x2="517.0" y2="162" class="grid"/>
<text x="517.0" y="184" class="tick" text-anchor="middle">100</text>
<line x1="677.5" y1="136" x2="677.5" y2="162" class="grid"/>
<text x="677.5" y="184" class="tick" text-anchor="middle">1,000</text>
<line x1="838.0" y1="136" x2="838.0" y2="162" class="grid"/>
<text x="838.0" y="184" class="tick" text-anchor="middle">10,000</text>
<text x="517.0" y="206" class="axis" text-anchor="middle">positions/launch (log scale)</text>
<text x="178" y="154.0" class="rowlabel" text-anchor="end">Jurkat_PROseq</text>
<line x1="345.9" y1="149.0" x2="569.9" y2="149.0" class="connector"/>
<circle cx="345.9" cy="149.0" r="7" fill="#eb6834" stroke="#fff" stroke-width="1.5"><title>Jurkat_PROseq dREG: 8.6 positions/launch, 2,201.88us avg per op, 5,617,218 positions</title></circle>
<circle cx="569.9" cy="149.0" r="7" fill="#2a78d6" stroke="#fff" stroke-width="1.5"><title>Jurkat_PROseq pydreg: 213.7 positions/launch, 11,411.72us avg per op, 5,617,218 positions</title></circle>
<text x="854" y="154.0" class="gap">25x</text>
<text x="196" y="228" class="colhead">Positions per H2D memcpy call</text>
<line x1="196.0" y1="240" x2="196.0" y2="266" class="grid"/>
<text x="196.0" y="288" class="tick" text-anchor="middle">1</text>
<line x1="356.5" y1="240" x2="356.5" y2="266" class="grid"/>
<text x="356.5" y="288" class="tick" text-anchor="middle">10</text>
<line x1="517.0" y1="240" x2="517.0" y2="266" class="grid"/>
<text x="517.0" y="288" class="tick" text-anchor="middle">100</text>
<line x1="677.5" y1="240" x2="677.5" y2="266" class="grid"/>
<text x="677.5" y="288" class="tick" text-anchor="middle">1,000</text>
<line x1="838.0" y1="240" x2="838.0" y2="266" class="grid"/>
<text x="838.0" y="288" class="tick" text-anchor="middle">10,000</text>
<text x="517.0" y="310" class="axis" text-anchor="middle">positions/call (log scale)</text>
<text x="178" y="258.0" class="rowlabel" text-anchor="end">Jurkat_PROseq</text>
<line x1="295.6" y1="253.0" x2="775.1" y2="253.0" class="connector"/>
<circle cx="295.6" cy="253.0" r="7" fill="#eb6834" stroke="#fff" stroke-width="1.5"><title>Jurkat_PROseq dREG: 4.2 positions/call, 2.33us avg per op, 5,617,218 positions</title></circle>
<circle cx="775.1" cy="253.0" r="7" fill="#2a78d6" stroke="#fff" stroke-width="1.5"><title>Jurkat_PROseq pydreg: 4,058.7 positions/call, 478.55us avg per op, 5,617,218 positions</title></circle>
<text x="854" y="258.0" class="gap">972x</text>
</svg>
