<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img">
<title>Positions processed per GPU operation: dREG vs pydreg, log scale</title>
<style>
text { font-family: DejaVu Sans, Helvetica, Arial, sans-serif; fill: #202124; }
.title { font-size: 26px; font-weight: 600; }
.subtitle { font-size: 17px; fill: #5f6368; }
.rowlabel { font-size: 19px; font-weight: 600; }
.tick { font-size: 15px; fill: #5f6368; }
.value { font-size: 16px; font-weight: 600; }
.gap { font-size: 16px; fill: #5f6368; }
.legend { font-size: 17px; }
.grid { stroke: #e3e6e8; stroke-width: 1; }
.connector { stroke: #c7c6bd; stroke-width: 2; }
</style>
<rect width="720" height="380" fill="#fff"/>
<text x="210" y="34" class="title">Work done per GPU operation</text>
<text x="210" y="58" class="subtitle">Same 5,617,218-position phase -- log scale, higher = more efficient</text>
<line x1="210.0" y1="110" x2="210.0" y2="320" class="grid"/>
<text x="210.0" y="344" class="tick" text-anchor="middle">1</text>
<line x1="322.5" y1="110" x2="322.5" y2="320" class="grid"/>
<text x="322.5" y="344" class="tick" text-anchor="middle">10</text>
<line x1="435.0" y1="110" x2="435.0" y2="320" class="grid"/>
<text x="435.0" y="344" class="tick" text-anchor="middle">100</text>
<line x1="547.5" y1="110" x2="547.5" y2="320" class="grid"/>
<text x="547.5" y="344" class="tick" text-anchor="middle">1000</text>
<line x1="660.0" y1="110" x2="660.0" y2="320" class="grid"/>
<text x="660.0" y="344" class="tick" text-anchor="middle">10000</text>
<text x="190" y="152.5" class="rowlabel" text-anchor="end">Kernel launch</text>
<line x1="315.1" y1="162.5" x2="472.1" y2="162.5" class="connector"/>
<circle cx="315.1" cy="162.5" r="9" fill="#eb6834" stroke="#fff" stroke-width="2"><title>dREG: 8.6 positions/launch, 2201.88us avg per op</title></circle>
<text x="315.1" y="146.5" class="value" text-anchor="middle" fill="#eb6834">8.6</text>
<circle cx="472.1" cy="162.5" r="9" fill="#2a78d6" stroke="#fff" stroke-width="2"><title>pydreg: 213.7 positions/launch, 11411.72us avg per op</title></circle>
<text x="472.1" y="188.5" class="value" text-anchor="middle" fill="#2a78d6">213.7</text>
<text x="393.6" y="132.5" class="gap" text-anchor="middle">25x</text>
<text x="190" y="257.5" class="rowlabel" text-anchor="end">H2D memcpy call</text>
<line x1="279.8" y1="267.5" x2="615.9" y2="267.5" class="connector"/>
<circle cx="279.8" cy="267.5" r="9" fill="#eb6834" stroke="#fff" stroke-width="2"><title>dREG: 4.2 positions/call, 2.33us avg per op</title></circle>
<text x="279.8" y="251.5" class="value" text-anchor="middle" fill="#eb6834">4.2</text>
<circle cx="615.9" cy="267.5" r="9" fill="#2a78d6" stroke="#fff" stroke-width="2"><title>pydreg: 4058.7 positions/call, 478.55us avg per op</title></circle>
<text x="615.9" y="293.5" class="value" text-anchor="middle" fill="#2a78d6">4,058.7</text>
<text x="447.9" y="237.5" class="gap" text-anchor="middle">972x</text>
<text x="435.0" y="372" class="tick" text-anchor="middle">Positions processed per operation (log scale)</text>
<circle cx="210" cy="76" r="7" fill="#eb6834"/>
<text x="224" y="81" class="legend">dREG</text>
<circle cx="310" cy="76" r="7" fill="#2a78d6"/>
<text x="324" y="81" class="legend">pydreg</text>
</svg>
