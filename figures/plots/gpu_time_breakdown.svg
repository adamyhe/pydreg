<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="245" viewBox="0 0 1040 245" role="img">
<title>Where dREG's and pydreg's GPU time goes, per library, informative-positions scoring phase</title>
<style>
text { font-family: DejaVu Sans, Helvetica, Arial, sans-serif; fill: #202124; }
.title { font-size: 26px; font-weight: 600; }
.subtitle { font-size: 17px; fill: #5f6368; }
.colhead { font-size: 19px; font-weight: 600; }
.rowlabel { font-size: 16px; font-weight: 600; }
.panelstat { font-size: 14px; fill: #5f6368; }
.tick { font-size: 14px; fill: #5f6368; }
.axis { font-size: 16px; fill: #5f6368; }
.value { font-size: 14px; font-weight: 600; }
.gap { font-size: 14px; fill: #202124; }
.legend { font-size: 16px; }
.grid { stroke: #e3e6e8; stroke-width: 1; }
.plotbg { fill: #fbfbfa; stroke: #e3e6e8; }
.connector { stroke: #c7c6bd; stroke-width: 2; }
</style>
<rect width="1040" height="245" fill="#fff"/>
<text x="190" y="34" class="title">Where the GPU time actually goes</text>
<text x="190" y="58" class="subtitle">1 library, both sides phase-exact -- shared time axis, dREG on top of each pair</text>
<rect x="190" y="66" width="16" height="16" fill="#c7c6bd"/>
<text x="214" y="79" class="legend">Scheduling idle</text>
<rect x="362" y="66" width="16" height="16" fill="#1baf7a"/>
<text x="386" y="79" class="legend">Kernel compute</text>
<rect x="534" y="66" width="16" height="16" fill="#4a3aa7"/>
<text x="558" y="79" class="legend">Memcpy (&lt;1% of every bar)</text>
<line x1="190.0" y1="116" x2="190.0" y2="179" class="grid"/>
<text x="190.0" y="203" class="tick" text-anchor="middle">0s</text>
<line x1="313.4" y1="116" x2="313.4" y2="179" class="grid"/>
<text x="313.4" y="203" class="tick" text-anchor="middle">500s</text>
<line x1="436.8" y1="116" x2="436.8" y2="179" class="grid"/>
<text x="436.8" y="203" class="tick" text-anchor="middle">1,000s</text>
<line x1="560.2" y1="116" x2="560.2" y2="179" class="grid"/>
<text x="560.2" y="203" class="tick" text-anchor="middle">1,500s</text>
<line x1="683.7" y1="116" x2="683.7" y2="179" class="grid"/>
<text x="683.7" y="203" class="tick" text-anchor="middle">2,000s</text>
<text x="174" y="140.5" class="rowlabel" text-anchor="end">Jurkat_PROseq</text>
<rect x="190.0" y="116" width="162.9" height="17" fill="#c7c6bd"><title>Jurkat_PROseq dREG scheduling idle: 659.8s (27.1% of 2,431s); 653,677 kernel launches, 1,345,274 H2D memcpy calls, 5,617,218 positions</title></rect>
<rect x="352.9" y="116" width="436.2" height="17" fill="#1baf7a"><title>Jurkat_PROseq dREG kernel compute: 1,767.1s (72.7% of 2,431s); 653,677 kernel launches, 1,345,274 H2D memcpy calls, 5,617,218 positions</title></rect>
<rect x="789.0" y="116" width="1.0" height="17" fill="#4a3aa7"><title>Jurkat_PROseq dREG memcpy: 3.9s (0.2% of 2,431s); 653,677 kernel launches, 1,345,274 H2D memcpy calls, 5,617,218 positions</title></rect>
<text x="798.0" y="129" class="panelstat">dREG 2,431s</text>
<rect x="190.0" y="138" width="5.9" height="17" fill="#c7c6bd"><title>Jurkat_PROseq pydreg scheduling idle: 23.9s (5.4% of 439s); 26,281 kernel launches, 1,384 H2D memcpy calls, 5,617,218 positions</title></rect>
<rect x="195.9" y="138" width="102.3" height="17" fill="#1baf7a"><title>Jurkat_PROseq pydreg kernel compute: 414.5s (94.4% of 439s); 26,281 kernel launches, 1,384 H2D memcpy calls, 5,617,218 positions</title></rect>
<rect x="298.2" y="138" width="0.4" height="17" fill="#4a3aa7"><title>Jurkat_PROseq pydreg memcpy: 0.7s (0.2% of 439s); 26,281 kernel launches, 1,384 H2D memcpy calls, 5,617,218 positions</title></rect>
<text x="306.4" y="151" class="panelstat">pydreg 439s</text>
<text x="1024" y="140.5" class="gap" text-anchor="end">5.5x</text>
