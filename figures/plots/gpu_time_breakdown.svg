<text x="78" y="174.0" class="tick" text-anchor="end">2000s</text>
<rect x="85.0" y="410.6" width="140" height="119.4" fill="#c7c6bd" stroke="#fff" stroke-width="2"><title>dREG scheduling idle: 659.8s (27.1%)</title></rect>
<text x="155.0" y="476.3" class="barlabel" text-anchor="middle" fill="#fff">660s</text>
<rect x="85.0" y="90.7" width="140" height="319.9" fill="#1baf7a" stroke="#fff" stroke-width="2"><title>dREG kernel compute: 1767.1s (72.7%)</title></rect>
<text x="155.0" y="256.6" class="barlabel" text-anchor="middle" fill="#fff">1767s</text>
<rect x="85.0" y="90.0" width="140" height="0.7" fill="#4a3aa7" stroke="#fff" stroke-width="2"><title>dREG memcpy: 3.9s (0.2%)</title></rect>
<text x="155.0" y="564" class="grouplabel" text-anchor="middle">dREG</text>
<text x="155.0" y="588" class="tick" text-anchor="middle">2431s total</text>
<text x="155.0" y="612" class="tick" text-anchor="middle">653,677 kernel launches</text>
<text x="155.0" y="634" class="tick" text-anchor="middle">1,345,274 H2D memcpy calls</text>
<rect x="345.0" y="525.7" width="140" height="4.3" fill="#c7c6bd" stroke="#fff" stroke-width="2"><title>pydreg scheduling idle: 23.9s (5.4%)</title></rect>
<rect x="345.0" y="450.6" width="140" height="75.0" fill="#1baf7a" stroke="#fff" stroke-width="2"><title>pydreg kernel compute: 414.5s (94.4%)</title></rect>
<text x="415.0" y="494.2" class="barlabel" text-anchor="middle" fill="#fff">414s</text>
<rect x="345.0" y="450.5" width="140" height="0.1" fill="#4a3aa7" stroke="#fff" stroke-width="2"><title>pydreg memcpy: 0.7s (0.2%)</title></rect>
<text x="415.0" y="564" class="grouplabel" text-anchor="middle">pydreg</text>
<text x="415.0" y="588" class="tick" text-anchor="middle">439s total</text>
