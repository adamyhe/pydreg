<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img">
<title>Where dREG's and pydreg's GPU time goes, same 5,617,218-position scoring phase</title>
<style>
text { font-family: DejaVu Sans, Helvetica, Arial, sans-serif; fill: #202124; }
.title { font-size: 26px; font-weight: 600; }
.subtitle { font-size: 17px; fill: #5f6368; }
.tick { font-size: 17px; fill: #5f6368; }
.barlabel { font-size: 17px; font-weight: 600; }
.grouplabel { font-size: 21px; font-weight: 600; }
.legend { font-size: 17px; }
.callout { font-size: 17px; fill: #202124; }
.grid { stroke: #e3e6e8; stroke-width: 1; }
</style>
<rect width="720" height="660" fill="#fff"/>
<text x="90" y="34" class="title">Where the GPU time actually goes</text>
<text x="90" y="58" class="subtitle">Same 5,617,218-position phase, both sides phase-exact</text>
<line x1="90" y1="530.0" x2="480" y2="530.0" class="grid"/>
<text x="78" y="536.0" class="tick" text-anchor="end">0s</text>
