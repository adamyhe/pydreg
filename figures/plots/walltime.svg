<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" role="img">
<title>Wall time</title>
<style>
text { font-family: DejaVu Sans, Helvetica, Arial, sans-serif; fill: #202124; }
.title { font-size: 28px; font-weight: 600; }
.axis { font-size: 24px; }
.tick, .note, .value { font-size: 24px; fill: #5f6368; }
.lib { font-size: 24px; }
.plot { fill: #fff; stroke: #9aa0a6; }
.grid { stroke: #e3e6e8; stroke-width: 1; }
.diagonal { stroke: #5f6368; stroke-width: 2; stroke-dasharray: 7 6; }
.ref { stroke: #d62728; stroke-width: 1.2; stroke-dasharray: 5 4; }
.mark { fill: #2878b5; stroke: #174a6e; stroke-width: 1.5; }
.stem { stroke: #9aa0a6; stroke-width: 1.4; }
</style>
<rect width="560" height="560" fill="#fff"/>
<text x="90" y="30" class="title">Wall time</text>
<rect x="90" y="55" width="440" height="415" class="plot"/>
<line x1="90.0" y1="55" x2="90.0" y2="470" class="grid"/>
<line x1="90" y1="470.0" x2="530" y2="470.0" class="grid"/>
<text x="90.0" y="492" class="tick" text-anchor="middle">0.25</text>
<text x="80" y="474.0" class="tick" text-anchor="end">0.25</text>
<line x1="191.8" y1="55" x2="191.8" y2="470" class="grid"/>
