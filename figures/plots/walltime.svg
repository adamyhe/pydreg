<line x1="90" y1="278.0" x2="530" y2="278.0" class="grid"/>
<text x="293.6" y="492" class="tick" text-anchor="middle">1</text>
<text x="80" y="282.0" class="tick" text-anchor="end">1</text>
<line x1="395.4" y1="55" x2="395.4" y2="470" class="grid"/>
<line x1="90" y1="181.9" x2="530" y2="181.9" class="grid"/>
<text x="395.4" y="492" class="tick" text-anchor="middle">2</text>
<text x="80" y="185.9" class="tick" text-anchor="end">2</text>
<line x1="497.2" y1="55" x2="497.2" y2="470" class="grid"/>
<line x1="90" y1="85.9" x2="530" y2="85.9" class="grid"/>
